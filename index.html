<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest - Earn Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .logo { font-size: 28px; font-weight: 800; color: #38bdf8; margin-bottom: 8px; letter-spacing: -0.5px; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; background-color: #ffffff; color: #1e293b; border: none; padding: 14px 16px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .google-btn:hover { background-color: #f1f5f9; }
    .google-icon { width: 20px; height: 20px; }
    .user-info { display: none; margin-top: 15px; text-align: center; }
    .welcome-text { font-size: 20px; font-weight: 700; color: #4ade80; margin-bottom: 10px; }
    .user-email { color: #38bdf8; font-weight: 600; margin-bottom: 20px; word-break: break-all; font-size: 15px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    .logout-btn { background-color: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    #status-msg { margin-top: 15px; font-size: 13px; color: #facc15; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">WorkNest</div>
    <div class="subtitle">Complete simple tasks & earn daily</div>

    <div id="login-section">
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>
      <div id="status-msg"></div>
    </div>

    <div id="user-section" class="user-info">
      <div class="welcome-text">Login Safal Hua! 🎉</div>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 6px;">Logged in account:</p>
      <div id="user-email" class="user-email"></div>
      <button class="logout-btn" onclick="signOut()">Log Out</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dtnoscridxidckufaclr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm9zY3JpZHhpZGNrdWZhY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMzUyNjksImV4cCI6MjA3NzgwOTI2OX0.x4OshhAom5z4Xf40y-N4s30Qc_4rDdf1zXhJvj3sP5Q";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showDashboard(email) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('user-section').style.display = 'block';
      document.getElementById('user-email').innerText = email;
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        showDashboard(session.user.email);
      }
    });

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        showDashboard(session.user.email);
      }
    }

    async function signInWithGoogle() {
      document.getElementById('status-msg').innerText = "Connecting...";
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.href.split('#')[0]
        }
      });
      if (error) {
        document.getElementById('status-msg').innerText = "Error: " + error.message;
      }
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
      window.location.href = window.location.origin;
    }

    init();
  </script>
</body>
</html>
