<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WorkNest - Earn Daily Cash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(18, 26, 43, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
    
    #login-gatekeeper { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; text-align: center; background: radial-gradient(circle at top, #1e3a8a 0%, #070b14 70%); }
    .gate-logo { font-size: 2.2rem; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
    .gate-card { background: rgba(18, 26, 43, 0.9); border: 1px solid var(--card-border); border-radius: 24px; padding: 28px 20px; width: 100%; max-width: 380px; }
    
    #main-app { display: none; padding-bottom: 85px; }
    .top-header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(7, 11, 20, 0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--card-border); }
    .brand-logo { font-size: 1.35rem; font-weight: 800; color: #38bdf8; }
    .user-profile-badge { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); padding: 5px 12px; border-radius: 30px; font-size: 0.8rem; }
    .user-profile-badge img { width: 22px; height: 22px; border-radius: 50%; }

    .tab-view { display: none; padding: 18px; }
    .tab-view.active { display: block; }
    .glass-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 20px; margin-bottom: 16px; }
    .balance-card { background: linear-gradient(135deg, rgba(30, 58, 138, 0.8), rgba(15, 23, 42, 0.9)); border: 1px solid rgba(96, 165, 250, 0.4); }
    .bal-amt { font-size: 2.5rem; font-weight: 800; color: #fff; margin: 6px 0; }

    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; color: #fff; }
    .btn-green { background: #10b981; }
    .btn-google { background: #ffffff; color: #0f172a; }
    .custom-input { width: 100%; padding: 14px; background: #0b1220; border: 1px solid var(--card-border); border-radius: 10px; color: #fff; font-size: 0.95rem; margin-bottom: 14px; outline: none; }
    .frame-box { width: 100%; height: 720px; border-radius: 14px; overflow: hidden; border: 1px solid var(--card-border); background: #000; }
    iframe { width: 100%; height: 100%; border: none; }

    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: rgba(10, 15, 28, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .nav-tab.active { color: #38bdf8; }
    .nav-tab svg { width: 22px; height: 22px; fill: currentColor; }
    .menu-link { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; font-size: 0.92rem; }
    .menu-link:last-child { border-bottom: none; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; padding: 24px 18px; overflow-y: auto; }
    .modal-overlay.active { display: block; }
    .modal-sheet { background: #0f172a; border: 1px solid var(--card-border); border-radius: 20px; padding: 22px; margin-top: 40px; }
  </style>
</head>
<body>

  <!-- SCREEN 1: LOGIN GATEKEEPER -->
  <div id="login-gatekeeper">
    <div class="gate-logo">WorkNest</div>
    <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:24px;">Phone Tasks & Micro Earnings Portal</p>
    <div class="gate-card">
      <h3 style="font-size:1.15rem; margin-bottom:8px;">Sign In Required</h3>
      <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:20px; line-height:1.5;">
        Wallet balance aur UPI withdrawal account connect karne ke liye Google se sign in karein.
      </p>
      <button class="btn btn-google" onclick="loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div style="font-size:0.75rem; color:var(--text-muted); margin-top:16px;">100% Real Database Auth via Supabase</div>
    </div>
  </div>
  <script>
    const SUPABASE_URL = 'https://dtnoscridxidckufaclr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OXVT_08Aba7ARIhNzMgUvQ_S51UMD0w';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let balance = 0.00;

    async function initAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session && session.user) {
        setupUserApp(session.user);
      } else {
        document.getElementById('login-gatekeeper').style.display = 'flex';
        document.getElementById('main-app').style.display = 'none';
      }
    }

    async function loginWithGoogle() {
      await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function setupUserApp(user) {
      currentUser = user;
      document.getElementById('login-gatekeeper').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';

      const email = user.email || 'Worker';
      const name = user.user_metadata?.full_name || email.split('@')[0];
      const avatar = user.user_metadata?.avatar_url || 'https://via.placeholder.com/24';

      document.getElementById('userName').innerText = name;
      document.getElementById('userAvatar').src = avatar;
      document.getElementById('profEmail').innerText = email;
      document.getElementById('profUid').innerText = user.id;

      const { data } = await supabase.from('profiles').select('*').eq('id', user.id).single();
      if (data) {
        balance = parseFloat(data.balance || 0);
        document.getElementById('walletBal').innerText = '₹' + balance.toFixed(2);
      } else {
        await supabase.from('profiles').insert([{ id: user.id, email: email, balance: 0.00 }]);
      }
      loadWithdrawals();
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(t + '-view').classList.add('active');
      document.getElementById('tab-' + t).classList.add('active');

      if (t === 'tasks' && currentUser) {
        const frame = document.getElementById('timeFrame');
        const placement = 'b8b7d53772f1dc7c';
        if (!frame.src || frame.src === 'about:blank') {
          frame.src = 'https://timewall.io/offers?userId=' + currentUser.id + '&placement=' + placement;
        }
      }
    }

    async function submitUPI() {
      const amt = parseFloat(document.getElementById('wdAmt').value);
      const upi = document.getElementById('wdUpi').value.trim();

      if (!amt || amt < 50) return alert('Minimum withdrawal is ₹50.');
      if (amt > balance) return alert('Paryapt wallet balance nahi hai.');
      if (!upi.includes('@')) return alert('Sahi UPI ID daalein (jaise user@okhdfcbank).');

      const { error } = await supabase.from('withdrawals').insert([
        { user_id: currentUser.id, amount: amt, upi_id: upi, status: 'Pending Review' }
      ]);

      if (error) return alert('Error: ' + error.message);

      balance -= amt;
      document.getElementById('walletBal').innerText = '₹' + balance.toFixed(2);
      await supabase.from('profiles').update({ balance: balance }).eq('id', currentUser.id);

      alert('Withdrawal request submit ho gayi! 24 ghante me UPI par credit hogi.');
      document.getElementById('wdAmt').value = '';
      loadWithdrawals();
    }

    async function loadWithdrawals() {
      const { data } = await supabase.from('withdrawals').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      const box = document.getElementById('historyBox');
      if (!data || data.length === 0) {
        box.innerHTML = '<div style="color:var(--text-muted); font-size:0.82rem;">Koi pichla withdrawal record nahi hai.</div>';
        return;
      }
      box.innerHTML = data.map(item => `
        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
          <div>
            <div style="font-weight:700;">₹${parseFloat(item.amount).toFixed(2)}</div>
            <div style="font-size:0.75rem; color:#94a3b8;">${item.upi_id}</div>
          </div>
          <span style="color:#fbbf24; font-weight:700; font-size:0.8rem;">${item.status}</span>
        </div>
      `).join('');
    }

    function openDoc(topic) {
      const h = document.getElementById('docHeading');
      const t = document.getElementById('docText');
      if (topic === 'rules') {
        h.innerText = 'Zero-Ban Worker Rules';
        t.innerHTML = '1. Ek device par ek hi account allowed hai.<br>2. VPN/Proxy ka upyog strict ban hai.<br>3. Tasks verification automatic postback se hoti hai.';
      } else if (topic === 'support') {
        h.innerText = 'Help & Support';
        t.innerHTML = 'Email: support@worknest-india.pages.dev<br>Hours: 10 AM - 6 PM IST';
      } else if (topic === 'terms') {
        h.innerText = 'Terms & Conditions';
        t.innerHTML = 'All tasks are verified through third-party publisher postbacks. Credits are non-transferable.';
      } else if (topic === 'privacy') {
        h.innerText = 'Privacy Policy';
        t.innerHTML = 'WorkNest only retains user Google IDs and UPI addresses to process cashouts.';
      }
      document.getElementById('docModal').classList.add('active');
    }
    function closeDoc() { document.getElementById('docModal').classList.remove('active'); }

    initAuth();
  </script>
</body>
</html>
