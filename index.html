<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest - Worker Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #070d1e; color: #f8fafc; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #0f172a; padding: 22px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 12px 35px rgba(0,0,0,0.7); border: 1px solid #1e293b; }
    h2 { margin: 0; color: #38bdf8; text-align: center; font-size: 24px; }
    p.sub { font-size: 13px; color: #94a3b8; text-align: center; margin: 5px 0 20px 0; }
    label { font-size: 13px; color: #94a3b8; margin-top: 12px; display: block; font-weight: 500; }
    input, textarea { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: white; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #38bdf8; }
    .btn-google { width: 100%; padding: 13px; background: #ffffff; color: #0f172a; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; }
    .btn-primary { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
    .btn-success { background: #16a34a; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; }
    .btn-danger { background: #dc2626; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; }
    .hidden { display: none; }
    .msg { font-size: 13px; margin-top: 12px; text-align: center; }
    
    /* Stats Bar */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
    .stat-box { background: #020617; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; text-align: center; }
    .stat-val { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .stat-lbl { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    /* Task Workspace */
    .task-card { background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin-top: 15px; }
    audio { width: 100%; margin: 10px 0; border-radius: 6px; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; }

    /* UID Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-content { background: #0f172a; padding: 25px; border-radius: 14px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #38bdf8; }
    .uid-badge { background: #020617; padding: 12px; border-radius: 8px; font-size: 20px; font-weight: bold; color: #38bdf8; letter-spacing: 2px; margin: 15px 0; border: 1px dashed #38bdf8; }
  </style>
</head>
<body>

<div class="card">
  <h2>WorkNest</h2>
  <p class="sub">Worker Portal & Task Workspace</p>

  <!-- 1. GOOGLE LOGIN -->
  <div id="authSection">
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7 0-1.1.2-2 .4-2.7L1.9 6.4C.7 8.8 0 10.3 0 12s.7 3.2 1.9 5.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.3L1.9 16c1.8 3.8 5.6 7 10.1 7z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- 2. MANDATORY PROFILE FORM -->
  <div id="profileSection" class="hidden">
    <h3 style="color:#38bdf8; font-size:16px; margin:0 0 5px 0;">Worker Profile Form</h3>
    <p style="font-size:12px; color:#94a3b8; margin:0 0 10px 0;">Registration ke liye valid details bharein.</p>

    <label>Pura Naam</label>
    <input type="text" id="fullName" placeholder="Apna Poora Naam">

    <label>Mobile Number (10 Digits)</label>
    <input type="tel" id="userPhone" placeholder="Mobile Number" maxlength="10">

    <label>Government ID Number</label>
    <input type="text" id="govId" placeholder="Govt ID No">

    <button class="btn-primary" onclick="submitProfile()">Save & Generate UID</button>
  </div>

  <!-- 3. WORKER DASHBOARD & TASK WORKSPACE -->
  <div id="dashboardSection" class="hidden">
    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:10px;">
      <div>
        <div id="dashName" style="font-weight:bold; font-size:15px;"></div>
        <div id="dashUid" style="color:#38bdf8; font-size:12px; font-weight:600;"></div>
      </div>
      <button onclick="handleLogout()" style="background:#ef4444; border:none; color:white; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer;">Logout</button>
    </div>

    <!-- Earnings & Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <div id="statEarnings" class="stat-val" style="color:#22c55e;">₹0.00</div>
        <div class="stat-lbl">Today's Earnings</div>
      </div>
      <div class="stat-box">
        <div id="statTasks" class="stat-val">0</div>
        <div class="stat-lbl">Completed Tasks</div>
      </div>
    </div>

    <!-- Live Task Section -->
    <div class="task-card">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8;">
        <span id="taskIdLabel">Task #101 (Audio QC)</span>
        <span style="color:#22c55e; font-weight:bold;">Reward: ₹2.50</span>
      </div>

      <audio id="audioPlayer" controls style="display:block;">
        <source src="https://actions.google.com/sounds/v1/speech/hello.ogg" type="audio/ogg">
      </audio>

      <label style="margin-top:5px;">Audio Transcription (Check / Correct)</label>
      <textarea id="taskTranscript" rows="2">Hello, how can I help you today?</textarea>

      <div class="btn-row">
        <button class="btn-success" onclick="completeTask('Approved')">✔ Approve (₹2.50)</button>
        <button class="btn-danger" onclick="completeTask('Rejected')">✖ Reject</button>
      </div>
    </div>
  </div>

  <div id="status" class="msg"></div>
</div>

<!-- 4. UID POPUP MODAL -->
<div id="uidModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 style="color:#22c55e; margin:0;">Account Verified!</h3>
    <p style="font-size:13px; color:#cbd5e1; margin-top:8px;">Aapka WorkNest UID Code generate ho gaya:</p>
    <div id="modalUidDisplay" class="uid-badge"></div>
    <button class="btn-primary" onclick="closeModalAndShowDash()">Go to Dashboard</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://dtnoscridxidckufaclr.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm9zY3JpZHhpZGNrdWZhY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NjA1MzcsImV4cCI6MjEwOTEzNjUzN30.O3v64aJ5CD1eAqD_OP-ErLakzb96yR9wOrg1-PfC6pk";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentWorker = null;
  let earnings = 0.00;
  let completedCount = 0;

  const sampleAudios = [
    { id: 101, text: "Hello, how can I help you today?", url: "https://actions.google.com/sounds/v1/speech/hello.ogg" },
    { id: 102, text: "Thank you for reaching out to WorkNest support.", url: "https://actions.google.com/sounds/v1/speech/speech_thank_you.ogg" },
    { id: 103, text: "Your account verification is completed successfully.", url: "https://actions.google.com/sounds/v1/speech/hello.ogg" }
  ];
  let taskIndex = 0;

  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await client.auth.getSession();
    if (session && session.user) {
      verifyUserProfile(session.user);
    }
  });

  async function loginWithGoogle() {
    showStatus("Google login shuru ho raha hai...", "#38bdf8");
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) showStatus(error.message, "#ef4444");
  }

  async function verifyUserProfile(user) {
    document.getElementById("authSection").classList.add("hidden");
    showStatus("Profile verify ho rahi hai...", "#38bdf8");

    const { data } = await client
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .maybeSingle();

    showStatus("");

    if (data && data.full_name) {
      currentWorker = data;
      renderDashboard(data);
    } else {
      document.getElementById("profileSection").classList.remove("hidden");
      if (user.user_metadata && user.user_metadata.full_name) {
        document.getElementById("fullName").value = user.user_metadata.full_name;
      }
    }
  }

  async function submitProfile() {
    const fullName = document.getElementById("fullName").value.trim();
    const phone = document.getElementById("userPhone").value.trim().replace(/\D/g, '');
    const govId = document.getElementById("govId").value.trim().toUpperCase().replace(/\s/g, '');

    if (!fullName || phone.length < 10 || !govId) {
      showStatus("Saari details bharna zaroori hai!", "#ef4444");
      return;
    }

    showStatus("Profile save ho rahi hai...", "#38bdf8");
    const { data: { user } } = await client.auth.getUser();

    const { data, error } = await client.from('profiles').insert([
      {
        id: user.id,
        full_name: fullName,
        phone_number: phone,
        government_id: govId,
        is_verified: true
      }
    ]).select().single();

    if (error) {
      showStatus(error.code === '23505' ? "Yeh Phone/ID pehle se registered hai!" : error.message, "#ef4444");
      return;
    }

    currentWorker = data;
    showStatus("");
    document.getElementById("profileSection").classList.add("hidden");
    
    const workerUid = "WN-" + user.id.substring(0, 8).toUpperCase();
    document.getElementById("modalUidDisplay").innerText = workerUid;
    document.getElementById("uidModal").classList.remove("hidden");
  }

  function closeModalAndShowDash() {
    document.getElementById("uidModal").classList.add("hidden");
    renderDashboard(currentWorker);
  }

  function renderDashboard(data) {
    document.getElementById("profileSection").classList.add("hidden");
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("dashboardSection").classList.remove("hidden");
    document.getElementById("dashName").innerText = data.full_name;
    document.getElementById("dashUid").innerText = "WN-" + data.id.substring(0, 8).toUpperCase();
  }

  function completeTask(action) {
    if (action === 'Approved') {
      earnings += 2.50;
    }
    completedCount++;
    document.getElementById("statEarnings").innerText = "₹" + earnings.toFixed(2);
    document.getElementById("statTasks").innerText = completedCount;

    // Load next audio task
    taskIndex = (taskIndex + 1) % sampleAudios.length;
    const next = sampleAudios[taskIndex];
    document.getElementById("taskIdLabel").innerText = "Task #" + next.id + " (Audio QC)";
    document.getElementById("taskTranscript").value = next.text;
    const player = document.getElementById("audioPlayer");
    player.src = next.url;
    player.load();
    showStatus("Task completed! Next audio loaded.", "#22c55e");
    setTimeout(() => showStatus(""), 2000);
  }

  async function handleLogout() {
    await client.auth.signOut();
    location.reload();
  }

  function showStatus(text, color) {
    const el = document.getElementById("status");
    el.innerText = text;
    el.style.color = color || "white";
  }
</script>

</body>
</html>
