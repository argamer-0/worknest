<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WorkNest - Instant Audio Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 75px; }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; background: rgba(7, 11, 20, 0.95);
      border-bottom: 1px solid var(--border); backdrop-filter: blur(16px);
    }
    .brand { font-size: 1.3rem; font-weight: 800; color: #38bdf8; }
    .badge { background: rgba(16, 185, 129, 0.15); color: #34d399; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.3); }

    .container { padding: 18px; max-width: 550px; margin: auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
    .wallet-card { background: linear-gradient(135deg, #1e3a8a, #0b1329); border: 1px solid #3b82f6; }
    .bal-num { font-size: 2.5rem; font-weight: 800; color: #fff; margin: 4px 0; transition: transform 0.2s; }
    .bal-num.pop { transform: scale(1.1); color: #34d399; }

    .player-box {
      background: #090e1a; border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; margin: 12px 0 16px 0;
    }
    .controls { display: flex; align-items: center; gap: 14px; }
    .play-circle {
      width: 48px; height: 48px; border-radius: 50%; background: #38bdf8; border: none;
      display: flex; justify-content: center; align-items: center; cursor: pointer; color: #070b14;
      font-size: 1.25rem; font-weight: 900; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .play-circle:active { transform: scale(0.92); }
    .track-meta { flex: 1; }
    .track-title { font-size: 0.85rem; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
    .progress-bar { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: #38bdf8; transition: width 0.1s linear; }

    .input-box {
      width: 100%; padding: 14px; background: #070b14; border: 1px solid var(--border);
      border-radius: 12px; color: #fff; font-size: 0.95rem; margin-bottom: 12px; outline: none; resize: none;
    }
    .input-box:focus { border-color: #38bdf8; }
    .input-box.err-shake { border-color: var(--danger); animation: shake 0.3s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 0.95rem;
      font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; color: #fff;
    }
    .btn-green { background: #10b981; }
    .btn-disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

    .status-msg {
      font-size: 0.8rem; padding: 10px; border-radius: 8px; margin-bottom: 12px; display: none; line-height: 1.4;
    }
    .status-err { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); display: block; }
    .status-ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); display: block; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">WorkNest</div>
    <div class="badge">Instant QC Engine</div>
  </header>

  <div class="container">
    <div class="card wallet-card">
      <div style="font-size:0.75rem; color:#93c5fd; font-weight:600; text-transform:uppercase;">Worker Verified Balance</div>
      <div class="bal-num" id="userBal">₹0.00</div>
      <div style="font-size:0.78rem; color:#cbd5e1;">Accepts: Hindi & Hinglish Typing</div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:0.8rem; color:#38bdf8; font-weight:700;" id="batchIndex">Task ID: #TR-8921</span>
        <span style="font-size:0.82rem; color:#34d399; font-weight:800;">₹3.00 / Verified Clip</span>
      </div>

      <div class="player-box">
        <div class="controls">
          <button class="play-circle" id="playBtn" onclick="playInstantAudio()">▶</button>
          <div class="track-meta">
            <div class="track-title" id="audioLabel">Clip 1: Banking OTP Alert</div>
            <div class="progress-bar">
              <div class="progress-fill" id="pFill"></div>
            </div>
            <div style="font-size:0.72rem; color:var(--muted); margin-top:5px;" id="audioStatusText">▶ Button dabakar turant sunein</div>
          </div>
        </div>
      </div>

      <div id="statusAlert" class="status-msg"></div>

      <label style="font-size:0.8rem; color:#94a3b8; margin-bottom:8px; display:block; font-weight:600;">Suni gayi aawaz ko Hindi ya English aksharon me likhein:</label>
      <textarea id="taskInput" class="input-box" rows="2" placeholder="Example: Kripya apna OTP kisi ke sath..."></textarea>

      <button class="btn btn-disabled" id="subBtn" onclick="verifyAndSubmit()">Submit & Verify Task ➔</button>
    </div>

    <div class="card">
      <h4 style="font-size:0.9rem; margin-bottom:10px;">Verification Log</h4>
      <div id="logList" style="font-size:0.8rem; color:var(--muted);">Koi verified record nahi hai.</div>
    </div>
  </div>

  <script>
    // Pure fast voice + dual hindi/hinglish matching dictionary
    const tasks = [
      {
        id: "#TR-8921",
        label: "Clip 1: Banking Security Alert",
        speech: "कृपया अपना ओटीपी किसी के साथ साझा न करें",
        // Hindi + English phonetic both accepted
        validKeywords: ["otp", "kripya", "apna", "sath", "saja", "kare", "kripya", "साझा", "ओटीपी", "कृपया"]
      },
      {
        id: "#TR-8922",
        label: "Clip 2: E-Commerce Delivery Notice",
        speech: "आपका पार्सल आज दोपहर तक डिलीवर कर दिया जाएगा",
        validKeywords: ["parcel", "dopahar", "deliver", "jaega", "aaj", "aapka", "पार्सल", "दोपहर", "डिलीवर"]
      },
      {
        id: "#TR-8923",
        label: "Clip 3: Service Feedback Call",
        speech: "हमारी सेवा का उपयोग करने के लिए आपका धन्यवाद",
        validKeywords: ["sewa", "seva", "upyog", "dhanyawad", "dhanyavad", "hamari", "सेवा", "उपयोग", "धन्यवाद"]
      }
    ];

    let currentIndex = 0;
    let hasListened = false;
    let bal = parseFloat(localStorage.getItem('wn_verified_bal') || '0.00');
    document.getElementById('userBal').innerText = '₹' + bal.toFixed(2);

    const playBtn = document.getElementById('playBtn');
    const pFill = document.getElementById('pFill');
    const subBtn = document.getElementById('subBtn');
    const alertBox = document.getElementById('statusAlert');
    const taskInput = document.getElementById('taskInput');

    function loadTask(idx) {
      const t = tasks[idx % tasks.length];
      document.getElementById('batchIndex').innerText = "Task ID: " + t.id;
      document.getElementById('audioLabel').innerText = t.label;
      taskInput.value = '';
      taskInput.classList.remove('err-shake');
      alertBox.className = 'status-msg';
      alertBox.style.display = 'none';
      hasListened = false;
      subBtn.className = 'btn btn-disabled';
      document.getElementById('audioStatusText').innerText = "▶ Button dabakar turant sunein";
      pFill.style.width = '0%';
      playBtn.innerText = '▶';
    }

    function playInstantAudio() {
      const t = tasks[currentIndex % tasks.length];
      window.speechSynthesis.cancel(); // instant flush

      const utter = new SpeechSynthesisUtterance(t.speech);
      utter.lang = 'hi-IN';
      utter.rate = 1.0;

      playBtn.innerText = '🔊';
      pFill.style.width = '20%';

      let step = 20;
      const progressTimer = setInterval(() => {
        if (step < 90) {
          step += 20;
          pFill.style.width = step + '%';
        }
      }, 300);

      utter.onend = function() {
        clearInterval(progressTimer);
        playBtn.innerText = '▶';
        pFill.style.width = '100%';
        hasListened = true;
        document.getElementById('audioStatusText').innerText = "✓ Audio complete. Ab niche text likhein.";
        subBtn.className = 'btn btn-green';
      };

      utter.onerror = function() {
        clearInterval(progressTimer);
        playBtn.innerText = '▶';
      };

      // Direct instant execution
      window.speechSynthesis.speak(utter);
    }

    function verifyAndSubmit() {
      if (!hasListened) {
        alert('Pehle play button daba kar audio pura sunein!');
        return;
      }

      const rawInput = taskInput.value.toLowerCase().replace(/[^a-zA-Z0-9\u0900-\u097F\s]/g, ' ');
      const userWords = rawInput.split(/\s+/).filter(w => w.length > 1);
      const currentTask = tasks[currentIndex % tasks.length];

      if (userWords.length < 2) {
        taskInput.classList.add('err-shake');
        alertBox.className = 'status-msg status-err';
        alertBox.innerText = '✗ Bahut chhota text hai! Jo suna gaya hai use poora sentence likhein.';
        setTimeout(() => taskInput.classList.remove('err-shake'), 400);
        return;
      }

      // Check against Hindi or Hinglish keywords
      let matchedCount = 0;
      userWords.forEach(w => {
        if (currentTask.validKeywords.some(kw => kw.toLowerCase().includes(w) || w.includes(kw.toLowerCase()))) {
          matchedCount++;
        }
      });

      if (matchedCount < 2) {
        taskInput.classList.add('err-shake');
        alertBox.className = 'status-msg status-err';
        alertBox.innerText = '✗ Quality Failed! Suni gayi aawaz ke shabdon se match nahi hua. Kripya dhyan se sunkar sahi likhein.';
        setTimeout(() => taskInput.classList.remove('err-shake'), 400);
        return;
      }

      // PASS & REWARD
      bal += 3.00;
      localStorage.setItem('wn_verified_bal', bal.toFixed(2));

      const balEl = document.getElementById('userBal');
      balEl.innerText = '₹' + bal.toFixed(2);
      balEl.classList.add('pop');
      setTimeout(() => balEl.classList.remove('pop'), 250);

      alertBox.className = 'status-msg status-ok';
      alertBox.innerText = `✓ Verified Pass! ₹3.00 add ho gaye. Agla task aa raha hai...`;

      // Log
      const log = document.getElementById('logList');
      if (currentIndex === 0) log.innerHTML = '';
      const entry = document.createElement('div');
      entry.style.cssText = "display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);";
      entry.innerHTML = `
        <div>
          <span style="color:#fff; font-weight:600;">${currentTask.id}</span>
          <div style="font-size:0.72rem; color:#34d399;">Audio Matched: Verified ✓</div>
        </div>
        <span style="color:#34d399; font-weight:700;">+₹3.00</span>
      `;
      log.prepend(entry);

      setTimeout(() => {
        currentIndex++;
        loadTask(currentIndex);
      }, 1000);
    }

    loadTask(0);
  </script>
</body>
</html>
