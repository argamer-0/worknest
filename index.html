<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 30px 20px; width: 100%; max-width: 380px; text-align: center; }
    .google-btn { width: 100%; background: white; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; margin-top: 15px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color:#38bdf8;">WorkNest</h2>
    <div id="loading" style="margin-top:10px;">Checking status...</div>
    
    <div id="login-box" style="display:none;">
      <button class="google-btn" onclick="login()">Continue with Google</button>
    </div>

    <div id="user-box" style="display:none;">
      <h3 style="color:#4ade80; margin-top:15px;">Login Safal Hua! 🎉</h3>
      <p id="user-mail" style="margin-top:10px; word-break:break-all; color:#94a3b8;"></p>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(
      "https://dtnoscridxidckufaclr.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm9zY3JpZHhpZGNrdWZhY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMzUyNjksImV4cCI6MjA3NzgwOTI2OX0.x4OshhAom5z4Xf40y-N4s30Qc_4rDdf1zXhJvj3sP5Q"
    );

    function updateView(user) {
      document.getElementById('loading').style.display = 'none';
      if (user) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('user-box').style.display = 'block';
        document.getElementById('user-mail').innerText = user.email;
      } else {
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('user-box').style.display = 'none';
      }
    }

    async function check() {
      const { data: { session } } = await sb.auth.getSession();
      updateView(session ? session.user : null);
    }

    sb.auth.onAuthStateChange((_, session) => {
      updateView(session ? session.user : null);
    });

    async function login() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://worknest-india.pages.dev' }
      });
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.reload();
    }

    check();
  </script>
</body>
</html>
