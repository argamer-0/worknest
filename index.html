<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b1329; color: #fff; padding: 20px; }
    .box { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; max-width: 450px; margin: 0 auto; text-align: center; }
    .btn { width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; }
    .btn-red { background: #ef4444; color: #fff; margin-top: 15px; }
    #log { background: #000; color: #4ade80; text-align: left; padding: 12px; border-radius: 8px; font-size: 11px; margin-top: 20px; word-break: break-all; white-space: pre-wrap; max-height: 250px; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="box">
    <h2 style="color:#38bdf8;">WorkNest Status</h2>
    <div id="user-display" style="display:none; margin: 15px 0;">
      <h3 style="color:#4ade80;">Login Safal Hua! 🎉</h3>
      <p id="email-text" style="color:#38bdf8; font-weight:bold; margin-top:5px;"></p>
      <button class="btn btn-red" onclick="logout()">Log Out</button>
    </div>

    <div id="login-display">
      <button class="btn" onclick="login()">Continue with Google</button>
    </div>

    <div id="log">Logs load ho rahe hain...</div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    function printLog(msg) {
      logEl.innerText += "\n" + msg;
    }

    printLog("Current Full URL: " + window.location.href);

    const sb = supabase.createClient(
      "https://dtnoscridxidckufaclr.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm9zY3JpZHhpZGNrdWZhY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMzUyNjksImV4cCI6MjA3NzgwOTI2OX0.x4OshhAom5z4Xf40y-N4s30Qc_4rDdf1zXhJvj3sP5Q"
    );

    function setSuccess(email) {
      document.getElementById('login-display').style.display = 'none';
      document.getElementById('user-display').style.display = 'block';
      document.getElementById('email-text').innerText = email;
      printLog(">> SUCCESS: User detected -> " + email);
    }

    async function start() {
      // 1. Check if URL has ?code=
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const err = params.get('error_description') || params.get('error');

      if (err) {
        printLog(">> URL ERROR: " + err);
      }

      if (code) {
        printLog(">> Code found in URL! Exchanging code...");
        try {
          const { data, error } = await sb.auth.exchangeCodeForSession(code);
          if (error) {
            printLog(">> Code Exchange Error: " + error.message);
          } else if (data && data.session) {
            setSuccess(data.session.user.email);
            return;
          }
        } catch (e) {
          printLog(">> Catch error during exchange: " + e.message);
        }
      }

      // 2. Check getSession
      const { data: { session }, error: sessErr } = await sb.auth.getSession();
      if (sessErr) printLog(">> getSession Error: " + sessErr.message);
      if (session && session.user) {
        setSuccess(session.user.email);
      } else {
        printLog(">> Koi active session nahi mila.");
      }
    }

    sb.auth.onAuthStateChange((event, session) => {
      printLog(">> Auth Event Fired: " + event);
      if (session && session.user) {
        setSuccess(session.user.email);
      }
    });

    async function login() {
      printLog(">> Login button dabaya gaya...");
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) printLog(">> SignIn Error: " + error.message);
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = window.location.origin;
    }

    start();
  </script>
</body>
</html>
