<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest - Worker Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1329; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #131c35; padding: 25px; border-radius: 14px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
    h2 { margin: 0 0 5px 0; color: #38bdf8; text-align: center; }
    p.sub { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    label { font-size: 13px; color: #94a3b8; margin-top: 12px; display: block; font-weight: 500; }
    input { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background: #090d1a; color: white; font-size: 14px; outline: none; }
    .btn-google { width: 100%; padding: 12px; background: #ffffff; color: #0f172a; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; }
    .btn-primary { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .hidden { display: none; }
    .msg { font-size: 13px; margin-top: 12px; text-align: center; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-content { background: #151f38; padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #38bdf8; }
    .uid-badge { background: #090d1a; padding: 12px; border-radius: 8px; font-size: 20px; font-weight: bold; color: #38bdf8; letter-spacing: 2px; margin: 15px 0; border: 1px dashed #38bdf8; }
  </style>
</head>
<body>

<div class="card">
  <h2>WorkNest</h2>
  <p class="sub">Worker Authentication & Verification Portal</p>

  <!-- 1. GOOGLE LOGIN -->
  <div id="authSection">
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7 0-1.1.2-2 .4-2.7L1.9 6.4C.7 8.8 0 10.3 0 12s.7 3.2 1.9 5.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.3L1.9 16c1.8 3.8 5.6 7 10.1 7z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- 2. MANDATORY PROFILE FORM -->
  <div id="profileSection" class="hidden">
    <h3 style="color:#38bdf8; font-size:16px; margin:0 0 5px 0;">Worker Profile Form</h3>
    <p style="font-size:12px; color:#94a3b8; margin:0 0 10px 0;">Duplicate accounts ya details allow nahi hain.</p>

    <label>Pura Naam</label>
    <input type="text" id="fullName" placeholder="Apna Poora Naam">

    <label>Mobile Number (10 Digits)</label>
    <input type="tel" id="userPhone" placeholder="Mobile Number" maxlength="10">

    <label>Government ID Number</label>
    <input type="text" id="govId" placeholder="Govt ID No">

    <button class="btn-primary" onclick="submitProfile()">Save & Generate UID</button>
  </div>

  <!-- 3. WORKER DASHBOARD -->
  <div id="dashboardSection" class="hidden">
    <h3 style="color:#22c55e; margin:0 0 10px 0;">WorkNest Workspace</h3>
    <div style="background:#090d1a; padding:15px; border-radius:8px; font-size:14px; line-height:1.7;">
      <div><strong>Worker:</strong> <span id="dashName"></span></div>
      <div><strong>Worker UID:</strong> <span id="dashUid" style="color:#38bdf8;"></span></div>
      <div><strong>Status:</strong> <span style="color:#22c55e;">Active & Verified</span></div>
    </div>
    <button class="btn-primary" style="background:#ef4444; margin-top:15px;" onclick="handleLogout()">Logout</button>
  </div>

  <div id="status" class="msg"></div>
</div>

<!-- 4. UID POPUP MODAL -->
<div id="uidModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 style="color:#22c55e; margin:0;">Account Verified!</h3>
    <p style="font-size:13px; color:#cbd5e1; margin-top:8px;">Aapka WorkNest UID Code generate ho gaya:</p>
    <div id="modalUidDisplay" class="uid-badge"></div>
    <button class="btn-primary" onclick="closeModalAndShowDash()">Go to Dashboard</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://dtnoscridxidckufaclr.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm9zY3JpZHhpZGNrdWZhY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NjA1MzcsImV4cCI6MjEwOTEzNjUzN30.O3v64aJ5CD1eAqD_OP-ErLakzb96yR9wOrg1-PfC6pk";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentWorkerData = null;

  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await client.auth.getSession();
    if (session && session.user) {
      verifyUserProfile(session.user);
    }
  });

  async function loginWithGoogle() {
    showStatus("Google login khul raha hai...", "#38bdf8");
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname
      }
    });
    if (error) showStatus(error.message, "#ef4444");
  }

  async function verifyUserProfile(user) {
    document.getElementById("authSection").classList.add("hidden");
    showStatus("Profile verify ho rahi hai...", "#38bdf8");

    const { data } = await client
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .maybeSingle();

    showStatus("");

    if (data && data.full_name) {
      currentWorkerData = data;
      renderDashboard(data);
    } else {
      document.getElementById("profileSection").classList.remove("hidden");
      if (user.user_metadata && user.user_metadata.full_name) {
        document.getElementById("fullName").value = user.user_metadata.full_name;
      }
    }
  }

  async function submitProfile() {
    const fullName = document.getElementById("fullName").value.trim();
    const phone = document.getElementById("userPhone").value.trim().replace(/\D/g, '');
    const govId = document.getElementById("govId").value.trim().toUpperCase().replace(/\s/g, '');

    if (!fullName || phone.length < 10 || !govId) {
      showStatus("Saari details bharna zaroori hai!", "#ef4444");
      return;
    }

    showStatus("Profile save ho rahi hai...", "#38bdf8");
    const { data: { user } } = await client.auth.getUser();

    const { data, error } = await client.from('profiles').insert([
      {
        id: user.id,
        full_name: fullName,
        phone_number: phone,
        government_id: govId,
        is_verified: true
      }
    ]).select().single();

    if (error) {
      if (error.code === '23505') {
        showStatus("Yeh Phone Number ya ID pehle se registered hai!", "#ef4444");
      } else {
        showStatus(error.message, "#ef4444");
      }
      return;
    }

    currentWorkerData = data;
    showStatus("");
    document.getElementById("profileSection").classList.add("hidden");
    
    const workerUid = "WN-" + user.id.substring(0, 8).toUpperCase();
    document.getElementById("modalUidDisplay").innerText = workerUid;
    document.getElementById("uidModal").classList.remove("hidden");
  }

  function closeModalAndShowDash() {
    document.getElementById("uidModal").classList.add("hidden");
    renderDashboard(currentWorkerData);
  }

  function renderDashboard(data) {
    document.getElementById("profileSection").classList.add("hidden");
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("dashboardSection").classList.remove("hidden");
    document.getElementById("dashName").innerText = data.full_name;
    document.getElementById("dashUid").innerText = "WN-" + data.id.substring(0, 8).toUpperCase();
  }

  async function handleLogout() {
    await client.auth.signOut();
    location.reload();
  }

  function showStatus(text, color) {
    const el = document.getElementById("status");
    el.innerText = text;
    el.style.color = color || "white";
  }
</script>

</body>
</html>
