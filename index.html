<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #0b1329; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .box { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px 20px; width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    .btn-login { width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-logout { width: 100%; background: #ef4444; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
    .user-card { background: #0f172a; border: 1px solid #22c55e; padding: 15px; border-radius: 10px; margin: 15px 0; }
  </style>
</head>
<body>

  <div class="box">
    <h2>WorkNest</h2>
    <p>Daily Task & Earning Platform</p>

    <div id="logged-out-view">
      <button class="btn-login" onclick="login()">👉 Continue with Google</button>
      <div id="err" style="color: #f87171; font-size: 13px; margin-top: 15px;"></div>
    </div>

    <div id="logged-in-view" style="display:none;">
      <h3 style="color: #4ade80;">Login Safal Hua! 🎉</h3>
      <div class="user-card">
        <span style="color:#94a3b8; font-size:12px;">Aapka Email:</span>
        <div id="user-email" style="color:#38bdf8; font-weight:bold; margin-top:5px; word-break:break-all;"></div>
      </div>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(
      "https://dtnoscridxidckufaclr.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm9zY3JpZHhpZGNrdWZhY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMzUyNjksImV4cCI6MjA3NzgwOTI2OX0.x4OshhAom5z4Xf40y-N4s30Qc_4rDdf1zXhJvj3sP5Q"
    );

    function displayUser(email) {
      document.getElementById('logged-out-view').style.display = 'none';
      document.getElementById('logged-in-view').style.display = 'block';
      document.getElementById('user-email').innerText = email;
    }

    // Hash ya code se turant session pakadne ke liye
    sb.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        displayUser(session.user.email);
      }
    });

    async function checkCurrent() {
      const { data: { session }, error } = await sb.auth.getSession();
      if (session && session.user) {
        displayUser(session.user.email);
      }
      if (error) {
        document.getElementById('err').innerText = error.message;
      }
    }

    async function login() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/'
        }
      });
      if (error) document.getElementById('err').innerText = error.message;
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = window.location.origin;
    }

    checkCurrent();
  </script>
</body>
</html>
