<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #0b1329; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .box { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; margin-bottom: 6px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .btn-login { width: 100%; background: #ffffff; color: #0f172a; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn-logout { width: 100%; background: #ef4444; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 18px; width: 100%; }
    .user-box { background: #0f172a; border: 2px solid #22c55e; border-radius: 12px; padding: 16px; margin: 15px 0; }
  </style>
</head>
<body>

  <div class="box">
    <h2>WorkNest</h2>
    <p>Daily Task & Earning Platform</p>

    <div id="login-section">
      <button class="btn-login" onclick="login()">👉 Continue with Google</button>
    </div>

    <div id="user-section" style="display:none;">
      <h3 style="color: #4ade80;">Login Safal Hua! 🎉</h3>
      <div class="user-box">
        <div style="font-size:12px; color:#94a3b8;">Welcome,</div>
        <div id="user-email" style="font-size:15px; color:#38bdf8; font-weight:bold; margin-top:4px; word-break:break-all;"></div>
      </div>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dtnoscridxidckufaclr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm9zY3JpZHhpZGNrdWZhY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMzUyNjksImV4cCI6MjA3NzgwOTI2OX0.x4OshhAom5z4Xf40y-N4s30Qc_4rDdf1zXhJvj3sP5Q";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showDashboard(email) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('user-section').style.display = 'block';
      document.getElementById('user-email').innerText = email;
    }

    // JWT token se seedha user email nikaalna
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    function checkAuth() {
      // 1. Agar hash me token aaya hai
      if (window.location.hash) {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');
        if (token) {
          const payload = parseJwt(token);
          if (payload && payload.email) {
            localStorage.setItem('worknest_user', payload.email);
            showDashboard(payload.email);
            window.history.replaceState(null, '', window.location.pathname);
            return;
          }
        }
      }

      // 2. Agar pehle se logged in hai
      const savedUser = localStorage.getItem('worknest_user');
      if (savedUser) {
        showDashboard(savedUser);
      }
    }

    async function login() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
    }

    function logout() {
      localStorage.removeItem('worknest_user');
      sb.auth.signOut();
      window.location.reload();
    }

    checkAuth();
  </script>
</body>
</html>
